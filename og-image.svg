<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&amp;family=Space+Grotesk:wght@600;700&amp;display=swap');
      .title { font-family: 'Unbounded', sans-serif; font-weight: 800; fill: #F5F5F5; font-size: 82px; letter-spacing: -2px; }
      .lead { font-family: 'Space Grotesk', sans-serif; font-weight: 600; fill: #A0A0A0; font-size: 28px; letter-spacing: 0.5px; }
      .badge { font-family: 'Space Grotesk', sans-serif; font-weight: 700; fill: #120C06; font-size: 16px; letter-spacing: 1px; }
      .tag { font-family: 'Space Grotesk', sans-serif; font-weight: 700; fill: #FF6B00; font-size: 20px; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Fond encre -->
  <rect width="1200" height="630" fill="#0B0B0B"/>

  <!-- Trame de fond subtile -->
  <line x1="120" y1="0" x2="120" y2="630" stroke="rgba(245,245,245,0.06)" stroke-width="1"/>
  <line x1="1080" y1="0" x2="1080" y2="630" stroke="rgba(245,245,245,0.06)" stroke-width="1"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="rgba(245,245,245,0.06)" stroke-width="1"/>

  <!-- Repères de coupe print -->
  <path d="M40 70 L40 40 L70 40" fill="none" stroke="#FF6B00" stroke-width="4"/>
  <path d="M1160 70 L1160 40 L1130 40" fill="none" stroke="#FF6B00" stroke-width="4"/>
  <path d="M40 560 L40 590 L70 590" fill="none" stroke="#FF6B00" stroke-width="4"/>
  <path d="M1160 560 L1160 590 L1130 590" fill="none" stroke="#FF6B00" stroke-width="4"/>

  <!-- Mot fantôme de fond -->
  <text x="1150" y="500" font-family="'Unbounded', sans-serif" font-weight="800" font-size="280" fill="none" stroke="rgba(245,245,245,0.04)" stroke-width="3" text-anchor="end">WANY</text>

  <!-- Badge Signal Kicker -->
  <rect x="120" y="100" width="340" height="42" rx="4" fill="#FF6B00"/>
  <text x="138" y="127" class="badge">STUDIO WEB SPORT &amp; PERFORMANCE</text>

  <!-- Titre Principal -->
  <text x="120" y="240" class="title">DES SITES QUI</text>
  <text x="120" y="330" class="title" fill="#FF6B00" style="fill: #FF6B00;">CONVERTISSENT.</text>

  <!-- Sous-titre -->
  <text x="120" y="410" class="lead">Création web sur-mesure pour coachs sportifs &amp; indépendants d'élite.</text>

  <!-- Pied de carte -->
  <text x="120" y="565" class="tag">01 · PERFORMANCE 100/100</text>
  <text x="520" y="565" class="tag">02 · ZERO TEMPLATE</text>
  <text x="860" y="565" class="tag">03 · RETOUCHES ILLIMITÉES</text>
</svg>